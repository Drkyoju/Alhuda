name = "alhuda"
compatibility_date = "2024-06-01"

main = "worker.js"

[vars]
BAKED_TTS_ONLY = "0"
# Skip old baked narrator MP3s — always synthesize with live Azure Hamed.
SKIP_BAKED_TTS = "1"
AZURE_SPEECH_VOICE = "ar-SA-HamedNeural"
# Legacy bake-script vars only — lesson /api/tts ignores Fish/ElevenLabs.

[assets]
directory = "."
binding = "ASSETS"
not_found_handling = "single-page-application"
html_handling = "auto-trailing-slash"
