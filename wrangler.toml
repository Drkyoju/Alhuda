name = "alhuda"
compatibility_date = "2024-06-01"

main = "worker.js"

[vars]
BAKED_TTS_ONLY = "0"
# Live Fish «راوٍ عربي حكيم» only — voice + model hardcoded in fish-audio-tts.js.
# Quran ayahs = Hudhaify. Azure / ElevenLabs / Google lesson paths are disabled.
SKIP_BAKED_TTS = "1"

[assets]
directory = "."
binding = "ASSETS"
not_found_handling = "single-page-application"
html_handling = "auto-trailing-slash"
