name = "alhuda"
compatibility_date = "2024-06-01"

main = "worker.js"

[vars]
BAKED_TTS_ONLY = "0"
# Skip old baked narrator MP3s — always synthesize with live Fish (your voice + s2-pro).
SKIP_BAKED_TTS = "1"
FISH_TTS_MODEL = "s2.1-pro"

[assets]
directory = "."
binding = "ASSETS"
not_found_handling = "single-page-application"
html_handling = "auto-trailing-slash"
