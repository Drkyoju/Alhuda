name = "alhuda"
compatibility_date = "2024-06-01"

main = "worker.js"

[vars]
BAKED_TTS_ONLY = "0"
# Skip old baked narrator MP3s — always synthesize with live Fish «راوٍ عربي حكيم».
SKIP_BAKED_TTS = "1"
FISH_VOICE_ID = "aa9c8260269c411d9863ab1b1bfa3158"
FISH_TTS_MODEL = "s2.1-pro"
# Quran stays Hudhaify. Azure Hamed is not the active lesson voice.

[assets]
directory = "."
binding = "ASSETS"
not_found_handling = "single-page-application"
html_handling = "auto-trailing-slash"
