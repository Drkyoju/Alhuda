name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run Playwright tests
        run: npm run test:smoke && npm run test:a11y && npm run test:e2e && npm run check:baked-tts
        env:
          CI: true
          # Full Fish v30 bake committed — require 100% coverage.
          ALLOW_BAKED_TTS_MISS: "0"
  deploy:
    needs: smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Deploy with Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          secrets: |
            FISH_API_KEY
            FISH_VOICE_ID
            FISH_TTS_MODEL
            ELEVENLABS_API_KEY
            GOOGLE_TTS_API_KEY
            AZURE_SPEECH_KEY
            AZURE_SPEECH_REGION
            AUTH_NAME_PEPPER
        env:
          FISH_API_KEY: ${{ secrets.FISH_API_KEY }}
          FISH_VOICE_ID: ${{ secrets.FISH_VOICE_ID }}
          FISH_TTS_MODEL: ${{ secrets.FISH_TTS_MODEL }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
          AUTH_NAME_PEPPER: ${{ secrets.AUTH_NAME_PEPPER }}

      - name: Live API smoke (TTS + Quran)
        run: npm run test:api
        env:
          CI: true
          LIVE_API_BASE: https://alhuda.ryodan71.workers.dev
